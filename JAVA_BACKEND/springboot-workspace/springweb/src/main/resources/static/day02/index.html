<!--

스프링 프로젝트내
src -> main -> java 파일 (controller등) = 서블릿 (동적할당 / 웹 컨테이너)
    src -> main -> java -> example -> day02 -> BoardController -> @Getmapping("/board/findall")
    통신경로 : [http://127.0.0.1:8080/board/findall](http://127.0.0.1:8080/board/findall)

-> 127.0.0.1:8080 (여기까지가 도메인.) 과거에는 따로 정적/동적 파일을 실행하였지만, 이제는 하나의 도메인에서 정적/동적 할당을 함.

src -> main -> resources -> static (html/css/js등) -> 정적서버/웹서버
    src -> main -> resources -> static -> day02 -> index.html 파일 생성
    통신경로 : [http://127.0.0.1:8080/day02/index.html](http://127.0.0.1:8080/day02/index.html)

-->
